name: Build Xenia with optional USB portal and verified host baseline
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: xenia-controller-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      VSCMD_SKIP_SENDTELEMETRY: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      UPSTREAM_SHA: 4f04bc7cc76b89bfcf7327b597d9770eaaddf935
      PATCH_SHA256: 03a06d936dd3f680558867c6752137433554d9edc03bc064d1503c8149c36a46
      ORIGINAL_SHA256: d12af3ce2fcb232278eb324e08718a85fc836a3aec1db7450f930945e649bca7
      MODIFIED_SHA256: 0b5b64d5bc24b2a13d736810c3cac34dad631f65904c8a88e2fea5b05659f49e
      LICENSE_SHA256: 369ea6b0f7ba57544067e9d470ca82a927da787fb0a749b11cb55f1fd0ba47ae
      VULKAN_VERSION: 1.4.363.1
      VULKAN_SHA256: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a
      MEMORY_SHA256: d77ff26fe31a4b6228b6726813995271c9280cf6f7ea9fb3b97caa6a0da1077d
      TEST_ORIGINAL_SHA256: e622631bae52b19ef0343389ff3b0060b2cb5fabfd4e933df80a369a336ed3a6
      TEST_CORRECTED_SHA256: 76ee24f0f087242f54b512255527ede4d733b53617cb6f01402a0981f688c9d8
    steps:
    - name: Keep reviewed source bytes unchanged
      run: |
        $ErrorActionPreference = 'Stop'
        git config --global core.autocrlf false
        if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git line endings' }
        git config --global core.eol lf
        if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git EOL' }
        git config --global core.longpaths true
        if ($LASTEXITCODE -ne 0) { throw 'Cannot configure Git long paths' }
    - name: Checkout reviewed public carrier
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: carrier
        persist-credentials: 'false'
        fetch-depth: '1'
    - name: Checkout exact upstream and pinned recursive submodules
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: xenia-canary/xenia-canary
        ref: 4f04bc7cc76b89bfcf7327b597d9770eaaddf935
        path: source
        submodules: recursive
        persist-credentials: 'false'
        fetch-depth: '1'
    - name: Verify untouched upstream, reviewed production patch and pinned submodules
      working-directory: source
      run: |
        $ErrorActionPreference = 'Stop'
        function Assert-Hash($Path, $Expected) {
          if ((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Expected) {
            throw "SHA256 mismatch: $Path"
          }
        }
        if ((git rev-parse HEAD).Trim() -ne $env:UPSTREAM_SHA -or $LASTEXITCODE -ne 0) { throw 'Wrong upstream commit' }
        if (@(git status --porcelain).Count -ne 0) { throw 'Upstream checkout is not clean' }
        $p = Get-Content -LiteralPath ../carrier/SOURCE-PROVENANCE.json -Raw | ConvertFrom-Json
        if ($p.upstream_sha -ne $env:UPSTREAM_SHA -or
            $p.only_modified_upstream_file -ne 'src/xenia/hid/input_system.cc' -or
            $p.patch_sha256 -ne $env:PATCH_SHA256 -or
            $p.upstream_source_sha256 -ne $env:ORIGINAL_SHA256 -or
            $p.modified_source_sha256 -ne $env:MODIFIED_SHA256 -or
            $p.license_sha256 -ne $env:LICENSE_SHA256) { throw 'Carrier provenance differs from review' }
        Assert-Hash ../carrier/portal-optional.patch $env:PATCH_SHA256
        Assert-Hash ../carrier/LICENSE $env:LICENSE_SHA256
        Assert-Hash LICENSE $env:LICENSE_SHA256
        Assert-Hash src/xenia/hid/input_system.cc $env:ORIGINAL_SHA256
        $submodules = @(git submodule status --recursive)
        if ($LASTEXITCODE -ne 0 -or $submodules.Count -eq 0) { throw 'Cannot verify pinned submodules' }
        foreach ($line in $submodules) {
          if ($line -notmatch '^ [0-9a-f]{40} ') { throw 'Submodule is missing or differs from its gitlink' }
        }
        Assert-Hash src/xenia/memory.cc $env:MEMORY_SHA256
        Assert-Hash src/xenia/base/testing/physical_heap_test.cc $env:TEST_ORIGINAL_SHA256
        Write-Output "PASS_UNMODIFIED_UPSTREAM_BASELINE_SOURCE_PINS"
    - name: Install pinned official Vulkan SDK on disposable runner
      run: |
        $ErrorActionPreference = 'Stop'
        # SHA256/size published by https://vulkan.lunarg.com/sdk/files.json.
        $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-pinned.exe'
        $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
        Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 300
        if ((Get-Item -LiteralPath $installer).Length -ne 303066832) { throw 'Vulkan installer size mismatch' }
        if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:VULKAN_SHA256) { throw 'Vulkan installer SHA256 mismatch' }
        $signature = Get-AuthenticodeSignature -LiteralPath $installer
        if ($signature.Status -ne 'Valid') { throw 'Vulkan installer signature is not valid' }
        $setup = Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -WindowStyle Hidden -Wait -PassThru
        if ($setup.ExitCode -ne 0) { throw "Vulkan installer failed: $($setup.ExitCode)" }
        $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
        foreach ($tool in @('glslangValidator.exe','spirv-opt.exe','spirv-dis.exe')) {
          if (-not (Test-Path -LiteralPath (Join-Path $sdk "Bin\$tool"))) { throw "Required SDK tool missing: $tool" }
        }
        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Reproduce stock baseline, validate complete host-aware suite and restore test bytes
      working-directory: source
      run: |
        $ErrorActionPreference = 'Stop'
        @'
        import hashlib, json, os, subprocess, sys, xml.etree.ElementTree as ET
        from pathlib import Path

        def need(ok, message):
            if not ok:
                raise RuntimeError(message)
        def sha(data):
            return hashlib.sha256(data).hexdigest()
        def changes():
            r = subprocess.run(['git','diff','--name-only'], check=True, text=True, capture_output=True)
            return r.stdout.splitlines()

        test = Path('src/xenia/base/testing/physical_heap_test.cc')
        memory = Path('src/xenia/memory.cc')
        original = test.read_bytes()
        need(sha(original) == os.environ['TEST_ORIGINAL_SHA256'], 'Unexpected baseline test bytes')
        need(sha(memory.read_bytes()) == os.environ['MEMORY_SHA256'], 'Production memory changed before baseline')
        need(changes() == [], 'Baseline must run on unmodified upstream')
        OLD_BLOCK = b'  SECTION("alloc with alignment larger than page_size is rejected") {\n    // vE0000000 has a 0x1000 physical translation offset, so the host\n    // alignment check in PhysicalHeap::Alloc, which tests\n    // (address + host_address_offset_) % alignment, cannot be satisfied for\n    // an alignment above the page size where that offset is 0.\n    uint32_t alignment = 0x10000;  // 64KB\n    uint32_t addr = 0;\n    bool ok = heap.Alloc(0x10000, alignment, kMemoryAllocationReserve,\n                         kMemoryProtectRead, false, &addr);\n    REQUIRE_FALSE(ok);\n  }'
        NEW_BLOCK = b'  SECTION("large alignment follows the physical mapping offset") {\n    // The physical translation contributes 0x1000. Windows adds the same\n    // host-view offset, allowing host/physical alignment despite the guest\n    // virtual address itself not being 64KB-aligned. Other mappings have no\n    // host offset and must reject this request cleanly.\n    constexpr uint32_t alignment = 0x10000;\n    constexpr uint32_t size = 0x10000;\n    uint32_t addr = 0;\n    const uint32_t host_offset = heap.host_address_offset();\n    bool ok = heap.Alloc(size, alignment, kMemoryAllocationReserve,\n                         kMemoryProtectRead, false, &addr);\n    if (host_offset == 0) {\n      REQUIRE_FALSE(ok);\n      REQUIRE(addr == 0);\n    } else {\n      REQUIRE(host_offset == 0x1000);\n      REQUIRE(ok);\n      REQUIRE(heap.GetPhysicalAddress(addr) % alignment == 0);\n      REQUIRE((uint64_t(addr) + host_offset) % alignment == 0);\n      REQUIRE(uint64_t(addr) >= uint64_t(heap.heap_base()));\n      REQUIRE(uint64_t(addr) + size <=\n              uint64_t(heap.heap_base()) + heap.heap_size());\n    }\n  }'
        need(original.count(OLD_BLOCK) == 1, 'Reviewed fixture block is not unique')
        corrected = original.replace(OLD_BLOCK, NEW_BLOCK, 1)
        need(sha(corrected) == os.environ['TEST_CORRECTED_SHA256'], 'Corrected fixture differs from independent review')
        evidence = Path(os.environ['RUNNER_TEMP']) / 'xenia-host-validation-v2'
        evidence.mkdir()

        def run_suite(label):
            report = evidence / (label + '.xml')
            cmd = [sys.executable, 'xenia-build.py', 'test', '--config=release',
                   '--target=xenia-base-tests', '--', '--reporter', 'xml', '--out', str(report)]
            result = subprocess.run(cmd, check=False)
            need(report.is_file() and report.stat().st_size < 16*1024*1024, 'Missing/invalid full-suite XML')
            raw = report.read_bytes()
            need(b'<!DOCTYPE' not in raw and b'<!ENTITY' not in raw, 'Unexpected XML declarations')
            root = ET.fromstring(raw)
            need(root.tag == 'Catch', 'Unexpected pinned Catch2 XML root')
            def totals(tag):
                nodes = root.findall('./' + tag)
                need(len(nodes) == 1, 'Missing unique root XML totals: ' + tag)
                a = nodes[0].attrib
                need(set(a) == {'successes','failures','expectedFailures'}, 'Unexpected XML total attributes')
                v = {k:int(a[k]) for k in a}
                need(all(x >= 0 for x in v.values()) and v['expectedFailures'] == 0, 'Unexpected expected/negative failures')
                return v
            assertions = totals('OverallResults')
            cases = totals('OverallResultsCases')
            all_cases = root.findall('.//TestCase')
            need(len(all_cases) == cases['successes'] + cases['failures'] == 81, 'Full 81-case suite required')
            failed_cases = []
            for case in all_cases:
                overall = case.findall('./OverallResult')
                need(len(overall) == 1 and overall[0].get('success') in ('true','false'), 'Invalid testcase result')
                if overall[0].get('success') == 'false':
                    failed_cases.append(case)
            need(len(failed_cases) == cases['failures'], 'Testcase/totals mismatch')
            need(not any(root.findall('.//' + tag) for tag in ('Exception','FatalErrorCondition','Failure','Error')),
                 'Unexpected exception/fatal/non-expression failure')
            expressions = root.findall('.//Expression[@success="false"]')
            summary = {'exit_code':result.returncode, 'assertions':assertions,
                       'test_cases':cases, 'xml_sha256':sha(raw)}
            return summary, root, failed_cases, expressions

        def full_pass(summary, failures, expressions, assertion_count):
            return (summary['exit_code'] == 0 and summary['test_cases'] ==
                    {'successes':81,'failures':0,'expectedFailures':0} and
                    summary['assertions'] == {'successes':assertion_count,'failures':0,'expectedFailures':0}
                    and not failures and not expressions)

        fixture_applied = False
        proof = None
        try:
            baseline, root, failures, expressions = run_suite('baseline-stock')
            if full_pass(baseline, failures, expressions, 2232):
                final = baseline
                mode = 'STOCK_FULL_SUITE_PASSED_NO_TEST_OVERRIDE'
            else:
                need(baseline['exit_code'] == 1 and baseline['test_cases'] ==
                     {'successes':80,'failures':1,'expectedFailures':0} and baseline['assertions'] ==
                     {'successes':2231,'failures':1,'expectedFailures':0}, 'Unexpected stock baseline failure/counts')
                need(len(failures) == 1 and failures[0].get('name') == 'PhysicalHeap vE0000000 alignment'
                     and len(expressions) == 1, 'Unexpected failing baseline testcase/assertion')
                expression = expressions[0]
                need(expression.get('type') == 'REQUIRE_FALSE' and expression.get('line') == '173'
                     and expression.get('filename','').replace(chr(92),'/').endswith('/src/xenia/base/testing/physical_heap_test.cc')
                     and (expression.findtext('Original') or '').strip() == '!(ok)'
                     and (expression.findtext('Expanded') or '').strip() == '!true',
                     'Baseline is not the exact reviewed Windows fixture expectation')
                parents = {child:parent for parent in root.iter() for child in parent}
                need(parents.get(expression) is not None and parents[expression].tag == 'Section'
                     and parents[expression].get('name') == 'alloc with alignment larger than page_size is rejected',
                     'Unexpected failing baseline section')
                ancestor = parents[expression]
                while ancestor.tag != 'TestCase' and ancestor in parents:
                    ancestor = parents[ancestor]
                need(ancestor is failures[0], 'Failed assertion belongs to a different testcase')
                baseline['known_failure'] = {'case':failures[0].get('name'),
                    'section':parents[expression].get('name'), 'line':173,
                    'type':'REQUIRE_FALSE', 'original':'!(ok)', 'expanded':'!true'}
                print('PASS_EXACT_UNMODIFIED_UPSTREAM_WINDOWS_BASELINE_FAILURE_REPRODUCED')
                need(sha(memory.read_bytes()) == os.environ['MEMORY_SHA256'], 'Production memory changed during baseline')
                test.write_bytes(corrected)
                fixture_applied = True
                need(changes() == [str(test).replace(chr(92),'/')], 'Temporary change must be test fixture only')
                final, _, failures, expressions = run_suite('host-aware-fixture')
                need(full_pass(final, failures, expressions, 2237), 'Complete corrected 81-case suite did not pass')
                mode = 'WINDOWS_TEST_FIXTURE_CORRECTED_FULL_SUITE_PASSED'
            proof = {'schema':2, 'mode':mode, 'full_suite_passed':True,
                'baseline':baseline, 'final':final, 'test_fixture_override_applied':fixture_applied,
                'test_fixture_original_sha256':sha(original),
                'test_fixture_corrected_sha256':sha(corrected) if fixture_applied else None,
                'production_memory_sha256':os.environ['MEMORY_SHA256'],
                'test_override_scope':'Only host-aware expectation/alignment/bounds assertions; no production memory changes'}
        finally:
            current = test.read_bytes()
            need(sha(current) in (sha(original), sha(corrected)), 'Fixture changed unexpectedly; refusing blind restore')
            if current != original:
                test.write_bytes(original)
            need(sha(test.read_bytes()) == os.environ['TEST_ORIGINAL_SHA256'], 'Original fixture restoration failed')
            need(sha(memory.read_bytes()) == os.environ['MEMORY_SHA256'], 'Production memory changed during host validation')
            need(changes() == [], 'Source must be unmodified after fixture restoration')
        need(proof is not None and proof['full_suite_passed'], 'Host validation did not finish')
        proof['original_fixture_restored_before_production_patch'] = True
        (evidence / 'HOST-TEST-PROOF.json').write_text(json.dumps(proof, indent=2)+'\n', encoding='utf-8')
        print(json.dumps(proof, indent=2))
        print('PASS_FULL_HOST_SUITE_AND_BYTE_EXACT_FIXTURE_RESTORE_NOT_CONTROLLER_RUNTIME_PROOF')
        '@ | python -
        if ($LASTEXITCODE -ne 0) { throw 'Stock/corrected full-suite validation or restoration failed' }
    - name: Apply only the reviewed production portal guard after fixture restoration
      working-directory: source
      run: |
        $ErrorActionPreference = 'Stop'
        if ((Get-FileHash -LiteralPath src/xenia/memory.cc -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMORY_SHA256) { throw 'Production memory changed' }
        if ((Get-FileHash -LiteralPath src/xenia/base/testing/physical_heap_test.cc -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TEST_ORIGINAL_SHA256) { throw 'Original test fixture not restored' }
        if (@(git status --porcelain).Count -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Source not clean before production patch' }
        git apply --check ../carrier/portal-optional.patch
        if ($LASTEXITCODE -ne 0) { throw 'Production patch check failed' }
        git apply ../carrier/portal-optional.patch
        if ($LASTEXITCODE -ne 0) { throw 'Production patch failed' }
        if ((Get-FileHash -LiteralPath src/xenia/hid/input_system.cc -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MODIFIED_SHA256) { throw 'Patched production source differs from review' }
        $changed = @(git diff --name-only)
        if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -ne 'src/xenia/hid/input_system.cc') { throw 'Unexpected production source changes' }
        git diff --check
        if ($LASTEXITCODE -ne 0) { throw 'Production patch whitespace check failed' }
        Write-Output 'PASS_RESTORED_FIXTURE_AND_ONLY_REVIEWED_PRODUCTION_PORTAL_GUARD'
    - name: Build only upstream xenia-app target in Release
      working-directory: source
      run: |
        $ErrorActionPreference = 'Stop'
        # Same build entry point and target as upstream Windows_x86.yml.
        python xenia-build.py build --config=release --target=xenia-app
        if ($LASTEXITCODE -ne 0) { throw 'Release app build failed' }
    - name: Verify x64 PE and stage exactly three public artifact files
      working-directory: source
      run: |
        $ErrorActionPreference = 'Stop'
        $hostProofPath = Join-Path $env:RUNNER_TEMP 'xenia-host-validation-v2/HOST-TEST-PROOF.json'
        $hostProof = Get-Content -LiteralPath $hostProofPath -Raw | ConvertFrom-Json
        if ($hostProof.schema -ne 2 -or $hostProof.full_suite_passed -ne $true -or
            $hostProof.original_fixture_restored_before_production_patch -ne $true -or
            $hostProof.final.test_cases.successes -ne 81 -or $hostProof.final.test_cases.failures -ne 0 -or
            $hostProof.final.assertions.failures -ne 0 -or
            $hostProof.production_memory_sha256 -ne $env:MEMORY_SHA256) { throw 'Missing complete verified host-suite proof' }
        if ((Get-FileHash -LiteralPath src/xenia/memory.cc -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MEMORY_SHA256) { throw 'Production memory changed before staging' }
        if ((Get-FileHash -LiteralPath src/xenia/base/testing/physical_heap_test.cc -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TEST_ORIGINAL_SHA256) { throw 'Test fixture was not restored before staging' }
        $inputPath = 'src/xenia/hid/input_system.cc'
        if ((Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MODIFIED_SHA256) { throw 'Reviewed source changed during build' }
        $changed = @(git diff --name-only)
        if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -ne $inputPath) { throw 'Unexpected tracked source changes after build' }
        $exe = 'build/bin/Windows/Release/xenia_canary.exe'
        if ((Get-Item -LiteralPath $exe).Length -le 100000) { throw 'Built app is unexpectedly small' }
        $stream = [IO.File]::OpenRead((Resolve-Path -LiteralPath $exe).Path)
        $reader = [IO.BinaryReader]::new($stream)
        try {
          if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Missing MZ header' }
          $stream.Position = 0x3C
          $peOffset = $reader.ReadInt32()
          if ($peOffset -lt 0x40 -or $peOffset -gt ($stream.Length - 24)) { throw 'Invalid PE offset' }
          $stream.Position = $peOffset
          if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'App is not a Windows x64 PE' }
        } finally { $reader.Dispose() }
        $stage = Join-Path $env:RUNNER_TEMP 'xenia-controller-artifact'
        if (Test-Path -LiteralPath $stage) { throw 'Artifact staging directory already exists' }
        New-Item -ItemType Directory -Path $stage | Out-Null
        Copy-Item -LiteralPath $exe -Destination (Join-Path $stage 'xenia_canary.exe')
        Copy-Item -LiteralPath LICENSE -Destination (Join-Path $stage 'LICENSE')
        $submodules = @(git submodule status --recursive)
        if ($LASTEXITCODE -ne 0) { throw 'Cannot record submodules' }
        $submodulePins = @()
        foreach ($line in $submodules) {
          if ($line -notmatch '^ ([0-9a-f]{40}) ([^ ]+)') { throw 'Submodule pin changed during build' }
          $submodulePins += [ordered]@{ path = $Matches[2]; commit = $Matches[1] }
        }
        $receipt = [ordered]@{
          schema = 2
          generated_utc = [DateTime]::UtcNow.ToString('o')
          repository = $env:GITHUB_REPOSITORY
          carrier_commit = $env:GITHUB_SHA
          run_id = $env:GITHUB_RUN_ID
          run_attempt = $env:GITHUB_RUN_ATTEMPT
          run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          runner = 'windows-2022 standard'
          runner_image_version = $env:ImageVersion
          upstream_repository = 'xenia-canary/xenia-canary'
          upstream_commit = $env:UPSTREAM_SHA
          patch_sha256 = $env:PATCH_SHA256
          original_input_system_sha256 = $env:ORIGINAL_SHA256
          modified_input_system_sha256 = $env:MODIFIED_SHA256
          vulkan_sdk_version = $env:VULKAN_VERSION
          vulkan_installer_sha256 = $env:VULKAN_SHA256
          submodules = $submodulePins
          app_filename = 'xenia_canary.exe'
          app_bytes = (Get-Item -LiteralPath $exe).Length
          app_sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          license_sha256 = (Get-FileHash -LiteralPath LICENSE -Algorithm SHA256).Hash.ToLowerInvariant()
          pe_machine = 'AMD64'
          host_base_tests_passed = $hostProof.full_suite_passed
          host_validation = $hostProof
          production_memory_sha256 = $env:MEMORY_SHA256
          original_physical_heap_test_sha256 = $env:TEST_ORIGINAL_SHA256
          app_executed_in_ci = $false
          controller_reconnect_verified = $false
          game_runtime_verified = $false
          required_runtime_setting = '[HID] enable_hardware_portal=false before app setup'
          change_scope = 'Optional USB Skylanders portal guard only; no libusb or game-code changes'
          artifact_allowlist = @('xenia_canary.exe','LICENSE','BUILD-RECEIPT.json')
        }
        $receipt | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $stage 'BUILD-RECEIPT.json') -Encoding utf8
        if (@(Get-ChildItem -LiteralPath $stage -File).Count -ne 3) { throw 'Unexpected artifact staging contents' }
        Write-Output 'PASS_X64_PE_AND_EXPLICIT_PUBLIC_ARTIFACT_ALLOWLIST_NOT_CONTROLLER_RUNTIME_PROOF'
    - name: Upload only app, license and public provenance receipt
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: xenia-canary-controller-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/xenia-controller-artifact/xenia_canary.exe
          ${{ runner.temp }}/xenia-controller-artifact/LICENSE
          ${{ runner.temp }}/xenia-controller-artifact/BUILD-RECEIPT.json
        if-no-files-found: error
        retention-days: '7'
        include-hidden-files: 'false'
        archive: 'true'
        overwrite: 'false'
